name: Build and test QBF

on: [push, pull_request, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package for Windows
        run: mvn --batch-mode clean verify
      - name: Verify Windows JavaFX native libraries
        shell: pwsh
        run: |
          $jar = "target/QBF.jar"
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect packaged JAR" }
          foreach ($library in @("glass.dll", "prism_sw.dll", "prism_d3d.dll")) {
            if (-not ($entries | Where-Object { $_ -eq $library -or $_ -like "*/$library" })) {
              throw "Missing Windows JavaFX native library: $library"
            }
          }
          Write-Host "Required Windows JavaFX DLLs present."
      - name: Upload Windows JAR
        uses: actions/upload-artifact@v4
        with:
          name: QBF-Windows-JAR
          path: target/QBF.jar
          if-no-files-found: error
